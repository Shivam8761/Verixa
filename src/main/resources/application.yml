server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: Verixa

  datasource:
    url: ${DB_URL:jdbc:h2:mem:verixa_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: verixa-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Application specific settings
verixa:
  jwt:
    secret: ${JWT_SECRET:verixa_super_secret_jwt_key_that_is_at_least_32_bytes_long_1234567890!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    model: ${AI_MODEL:gemini-1.5-flash}
  code-execution:
    url: ${CODE_EXECUTION_URL:https://judge0-ce.p.rapidapi.com}
    api-key: ${CODE_EXECUTION_API_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
